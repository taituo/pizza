[project]
name = "pizza-agent"
version = "0.1.0"
description = "Ordering agent workers: conversations as Temporal workflows, the agent harness behind a thin adapter."
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.36,<2",
  "httpx>=0.27,<1",
  "deepagents>=0.7,<0.8",
  "langchain>=1.5,<2",
  "langchain-anthropic>=1.7,<2",
  "langchain-openai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pizza_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
