# /api goes straight to the API (SSE does not pass through the nginx proxy), everything else to the UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pizza
spec:
  rules:
    - host: pizza.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
