apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pizza
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - worker.yaml
  - agent-worker.yaml
  - web.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: pizza
images:
  - name: pizza-server
    newName: ghcr.io/taituo/pizza-server
    newTag: latest
  - name: pizza-agent
    newName: ghcr.io/taituo/pizza-agent
    newTag: latest
  - name: pizza-web
    newName: ghcr.io/taituo/pizza-web
    newTag: latest
