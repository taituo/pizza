# Order workflow workers. Stateless: replicas can be added and killed freely;
# unfinished workflows continue on another worker from where they left off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      # Longer than the worker's shutdownGraceTime (20 s), so running activities have time to finish.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's node user
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: pizza-server
          command: ["node", "dist/worker/main.js"]
          envFrom:
            - configMapRef: { name: pizza-config }
            - secretRef: { name: pizza-secrets }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
