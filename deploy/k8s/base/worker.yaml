# Tilausketjujen workerit. Tilattomia: replikoita voi lisätä ja tappaa vapaasti,
# keskeneräiset ketjut jatkuvat toisella workerilla siitä, mihin jäivät.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      # Pidempi kuin workerin shutdownGraceTime (20 s), jotta käynnissä olevat activityt ehtivät valmistua.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # kuvan node-käyttäjä
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: pizza-server
          command: ["node", "dist/worker/main.js"]
          envFrom:
            - configMapRef: { name: pizza-config }
            - secretRef: { name: pizza-secrets }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
