# Pilvi (EKS/GKE): hallittu Postgres klusterin ulkopuolella, automaattinen skaalaus,
# replikat eri solmuille. DATABASE_URL Secretissä osoittaa hallittuun kantaan.
#   kubectl apply -k deploy/k8s/overlays/cloud
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pizza
resources:
  - ../../base
  - autoscaling.yaml
patches:
  - target: { kind: Deployment, name: "api|worker|web" }
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: pizza
  - target: { kind: Deployment, name: worker }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: WORKER_MAX_CONCURRENT_ACTIVITIES, value: "200" }
          - { name: WORKER_MAX_CONCURRENT_WORKFLOW_TASKS, value: "200" }
