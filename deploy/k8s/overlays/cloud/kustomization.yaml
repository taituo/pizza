# Cloud (EKS/GKE): managed Postgres outside the cluster, autoscaling,
# replicas on different nodes. DATABASE_URL in the Secret points to the managed database.
#   kubectl apply -k deploy/k8s/overlays/cloud
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pizza
resources:
  - ../../base
  - autoscaling.yaml
patches:
  - target: { kind: Deployment, name: "api|worker|web|agent-worker" }
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: pizza
  - target: { kind: Deployment, name: worker }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: WORKER_MAX_CONCURRENT_ACTIVITIES, value: "200" }
          - { name: WORKER_MAX_CONCURRENT_WORKFLOW_TASKS, value: "200" }
  # Agent workers prefer their own node pool when there is one. Label and taint the pool:
  #   pizza.dev/pool=agents   (taint: pizza.dev/pool=agents:NoSchedule)
  # Without such a pool they run on the general nodes.
  - target: { kind: Deployment, name: agent-worker }
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - { key: pizza.dev/pool, operator: In, values: [agents] }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: pizza.dev/pool, operator: Equal, value: agents, effect: NoSchedule }
