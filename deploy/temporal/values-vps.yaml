# Temporal for a small install (k3s, one node), same Postgres as the app.
# Chart: https://go.temporal.io/helm-charts, "temporal" (CI renders this with chart version 1.8.0).
#
#   helm upgrade --install temporal temporal --repo https://go.temporal.io/helm-charts --version 1.8.0 \
#     --namespace temporal --create-namespace -f deploy/temporal/values-vps.yaml --timeout 900s
#
# Requires the Secret "temporal-db" (key "password") in the temporal namespace: see deploy/README.md.
server:
  replicaCount: 1
  config:
    persistence:
      # NOTE: the shard count cannot be changed after install. 512 goes a long way
      # (tens of thousands of concurrent workflows); a smaller value would save only a little memory.
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgres.pizza.svc.cluster.local:5432"
            connectProtocol: tcp
            user: pizza
            existingSecret: temporal-db
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
        visibility:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres.pizza.svc.cluster.local:5432"
            connectProtocol: tcp
            user: pizza
            existingSecret: temporal-db
            secretKey: password
            maxConns: 10
            maxIdleConns: 10
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 7d
web:
  replicaCount: 1
