# GitOps: Argo CD keeps the cluster identical to this repo's main branch.
#   kubectl apply -n argocd -f deploy/argocd/applications.yaml
# Switch the overlay (vps-k3s / cloud) and the values file per environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.8.0
      helm:
        releaseName: temporal
        valueFiles:
          - $values/deploy/temporal/values-vps.yaml
    - repoURL: https://github.com/taituo/pizza
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pizza
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: pizza
  source:
    repoURL: https://github.com/taituo/pizza
    targetRevision: main
    path: deploy/k8s/overlays/vps-k3s
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
